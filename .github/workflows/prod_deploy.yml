name: Deploy to PROD

# TODO restrict who and where can deploy to prod
on:
  workflow_call:
  workflow_dispatch:

jobs:
  prod-deploy:
    name: Deploy to PROD environment
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      destination: production
      ssh_key_secret: OPS_PROD_DEPLOY_KEY
    secrets: inherit
