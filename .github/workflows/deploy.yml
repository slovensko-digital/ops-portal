name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: staging or production, also the Kamal destination (config/deploy.<environment>.yml)
        required: true
        type: string

jobs:
  # Settings of each environment, the only place that maps them
  settings:
    name: Resolve ${{ inputs.environment }} settings
    runs-on: ubuntu-latest
    outputs:
      github_environment: ${{ steps.settings.outputs.github_environment }}
      ssh_key_secret: ${{ steps.settings.outputs.ssh_key_secret }}

    steps:
      - name: Resolve settings
        id: settings
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          case "$ENVIRONMENT" in
            staging)
              GITHUB_ENVIRONMENT=dev
              SSH_KEY_SECRET=DEV_DEPLOY_KEY
              ;;
            production)
              GITHUB_ENVIRONMENT=PROD
              SSH_KEY_SECRET=OPS_PROD_DEPLOY_KEY
              ;;
            *)
              echo "::error::Unknown environment '$ENVIRONMENT', use staging or production"
              exit 1
              ;;
          esac
          echo "github_environment=$GITHUB_ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "ssh_key_secret=$SSH_KEY_SECRET" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to ${{ inputs.environment }}
    needs: settings
    runs-on: ubuntu-latest
    environment: ${{ needs.settings.outputs.github_environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      - name: Install Kamal gem
        run: |
          KAMAL_VERSION=$(ruby -rbundler -e "puts Bundler.locked_gems.specs.find { |s| s.name == 'kamal' }&.version")
          gem install kamal -v $KAMAL_VERSION

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets[needs.settings.outputs.ssh_key_secret] }}

      - name: Run deploy command
        env:
          KAMAL_REGISTRY_USERNAME: ${{ secrets.KAMAL_REGISTRY_USERNAME }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          TRIAGE_ZAMMAD_API_TOKEN: ${{ secrets.TRIAGE_ZAMMAD_API_TOKEN }}
          TRIAGE_ZAMMAD_ADMIN_API_TOKEN: ${{ secrets.TRIAGE_ZAMMAD_ADMIN_API_TOKEN }}
          TRIAGE_ZAMMAD_WEBHOOK_SECRET: ${{ secrets.TRIAGE_ZAMMAD_WEBHOOK_SECRET }}
          ISSUE_PREVIEW_SECRET: ${{ secrets.ISSUE_PREVIEW_SECRET }}
          FACEBOOK_APP_ID: ${{ vars.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NOTIFICATION_SMTP_SERVER: ${{ vars.NOTIFICATION_SMTP_SERVER }}
          NOTIFICATION_SMTP_PORT: ${{ vars.NOTIFICATION_SMTP_PORT }}
          NOTIFICATION_SMTP_USERNAME: ${{ vars.NOTIFICATION_SMTP_USERNAME }}
          NOTIFICATION_SMTP_PASSWORD: ${{ secrets.NOTIFICATION_SMTP_PASSWORD }}
          DISCOURSE_API_KEY: ${{ secrets.DISCOURSE_API_KEY }}
          DISCOURSE_WEBHOOK_SECRET: ${{ secrets.DISCOURSE_WEBHOOK_SECRET }}
          DISCOURSE_API_USERNAME: ${{ vars.DISCOURSE_API_USERNAME }}
          AWS_S3_ACCESS_KEY_ID: ${{ secrets.AWS_S3_ACCESS_KEY_ID }}
          AWS_S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_SECRET_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ROLLBAR_ACCESS_TOKEN: ${{ secrets.ROLLBAR_ACCESS_TOKEN }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          MAINTENANCE: ${{ vars.MAINTENANCE }}
          ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY }}
          ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY }}
          ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT }}
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
          RAILS_LOG_LEVEL: ${{ vars.RAILS_LOG_LEVEL }}

        run: kamal deploy -d ${{ inputs.environment }}
